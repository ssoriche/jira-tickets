[package]
name = "jira-tickets"
version = "0.7.0"
edition = "2024"
description = "A fast desktop app for Jira tickets, grooming, and roadmaps"
license = "MIT"
authors = ["Shawn Sorichetti"]
repository = "https://github.com/ssoriche/jira-tickets"
readme = "README.md"
keywords = ["jira", "egui", "desktop", "grooming", "roadmap"]
categories = ["gui", "development-tools"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
ureq = { version = "3", features = ["json", "platform-verifier"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Decodes Jira avatars (PNG, JPEG); eframe already builds image with PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
snapshot = ["dep:egui_kittest"]
